<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Snowboard Trip</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap');

  :root{
    --accent: #7CC7F0;        /* glacier blue (primary) */
    --accent-soft: #A9D9F5;
    --accent-ink: #06121F;    /* text on accent buttons */
    --pine: #5CC2A0;          /* times */
    --rose: #F28DB2;
    --sky: #9FB8FF;
    --ink: #EAF2FA;
    --ink-soft: #93A4B8;
    --card: #111A26;
    --card-2: #1B2636;
    --line: rgba(255,255,255,0.10);
    --bg: #05080D;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{ height:100%; }

  body{
    background: var(--bg);
    font-family: 'Karla', sans-serif;
    color: var(--ink);
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    -webkit-user-select:none;
  }

  .phone{
    width:100%;
    max-width:460px;
    height:100dvh;
    max-height:900px;
    position:relative;
    display:flex;
    flex-direction:column;
  }

  .pages{ flex:1; position:relative; overflow:hidden; }

  .page{
    position:absolute;
    inset:0;
    padding: 26px 18px 96px;
    overflow-y:auto;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.28s ease;
    -webkit-overflow-scrolling:touch;
  }
  .page.active{ opacity:1; pointer-events:auto; }

  .progress{ display:flex; justify-content:center; gap:5px; padding: 14px 0 4px; flex-shrink:0; flex-wrap:wrap; }
  .progress .seg{ width:18px; height:3px; border-radius:2px; background: rgba(255,255,255,0.18); transition: background 0.2s ease; }
  .progress .seg.done{ background: var(--accent-soft); }
  .progress .seg.on{ background: var(--accent); }

  /* ---------- COVER ---------- */
  .cover-card{
    background: var(--card);
    border-radius: 22px;
    padding: 22px 22px 26px;
    box-shadow: 0 14px 34px rgba(0,0,0,0.35);
    position:relative;
    overflow:hidden;
    border: 1px solid var(--line);
  }
  .cover-card::before{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 90% 6%, rgba(159,184,255,0.18), transparent 30%),
      radial-gradient(circle at 4% 92%, rgba(124,199,240,0.14), transparent 28%);
    pointer-events:none;
  }
  .photo-frame{ border-radius: 16px; overflow:hidden; border: 6px solid #fff; box-shadow: 0 6px 18px rgba(0,0,0,0.35); }
  .photo-frame svg{ display:block; width:100%; height:auto; }

  .eyebrow{
    margin-top:20px; text-align:center; font-size:12.5px; letter-spacing:0.16em;
    text-transform:uppercase; color: var(--sky); font-weight:700;
  }
  h1.title{
    font-family:'Fraunces', serif; font-weight:700; font-size:34px; line-height:1.08;
    text-align:center; color: var(--accent); margin-top:8px; letter-spacing:-0.01em;
  }
  .subdate{ text-align:center; margin-top:8px; font-size:15px; color: var(--ink-soft); font-weight:500; }
  .chips{ display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-top:16px; }
  .chip{ background: var(--card-2); border:1px solid var(--line); padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:600; color: var(--ink); }
  .tap-hint{ text-align:center; margin-top:22px; font-size:12px; color: var(--ink-soft); letter-spacing:0.03em; }

  .section-label{ margin: 0 4px 12px; display:flex; align-items:center; gap:10px; }
  .section-label .dot{ width:7px; height:7px; border-radius:50%; background: var(--accent); flex-shrink:0; }
  .section-label span{ font-family:'Fraunces', serif; font-weight:600; font-size:13px; letter-spacing:0.1em; text-transform:uppercase; color: var(--ink-soft); }

  /* ---------- TRIP DETAILS CARD ---------- */
  .travel-card{ background: var(--card); border-radius: 18px; border:1px solid var(--line); box-shadow: 0 6px 18px rgba(0,0,0,0.25); overflow:hidden; }
  .flight-row{ display:flex; justify-content:space-between; align-items:center; padding: 16px 18px; cursor:pointer; transition: background 0.15s ease; }
  .flight-row:active{ background: var(--card-2); }
  .flight-row + .flight-row{ border-top: 1px solid var(--line); }
  .flight-left{ display:flex; gap:12px; align-items:flex-start; }
  .flight-icon{ width:36px; height:36px; border-radius:10px; background: var(--card-2); display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }
  .flight-name{ font-weight:600; font-size:14.5px; color:var(--ink); }
  .flight-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .flight-date{ font-size:12.5px; font-weight:600; color: var(--accent); text-align:right; white-space:nowrap; padding-left:8px; }

  /* ---------- DAY CARD ---------- */
  .day-hero{ text-align:center; margin-bottom:20px; }
  .day-hero .eyebrow{ margin-top:0; }
  .day-hero .day-title{ font-family:'Fraunces', serif; font-weight:700; font-size:28px; color: var(--ink); margin-top:6px; }
  .day-hero .day-date{ font-size:14px; color: var(--ink-soft); margin-top:4px; font-weight:500; }
  .day-badge{ display:inline-block; margin-top:10px; font-size:11px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; padding: 4px 12px; border-radius:999px; }
  .badge-arrival{ background: rgba(124,199,240,0.28); color: #D4EEFB; }
  .badge-departure{ background: rgba(159,184,255,0.28); color: #E0E7FF; }

  .day-card{ background: var(--card); border-radius: 18px; border:1px solid var(--line); box-shadow: 0 6px 18px rgba(0,0,0,0.25); overflow:hidden; }
  .event-list{ padding: 8px 8px 4px; }
  .event{ display:flex; align-items:flex-start; gap:12px; padding:13px 10px; cursor:pointer; border-radius:12px; transition: background 0.15s ease; }
  .event:active{ background: var(--card-2); }
  .event + .event{ border-top:1px solid var(--line); }
  .event-time{ width:52px; flex-shrink:0; font-size:11.5px; font-weight:700; color: var(--pine); padding-top:2px; }
  .event-icon{ font-size:18px; flex-shrink:0; padding-top:1px; }
  .event-body{ flex:1; }
  .event-title{ font-size:14.5px; font-weight:600; color:var(--ink); }
  .event-note{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }

  .add-event-row{ display:flex; align-items:center; gap:10px; padding:13px 10px; cursor:pointer; border-top:1px solid var(--line); color: var(--accent); font-weight:700; font-size:13.5px; }
  .plus-circle{ width:22px; height:22px; border-radius:50%; border:1.5px dashed var(--accent); display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }

  .day-hint{ text-align:center; margin-top:12px; font-size:11.5px; font-weight:700; color:var(--ink); }
  .empty-state{ padding: 26px 18px 8px; text-align:center; color: var(--ink-soft); font-size:13px; }

  /* ---------- SYNC STATUS ---------- */
  .sync-status{ position:absolute; top: max(10px, env(safe-area-inset-top)); left:0; right:0; display:flex; justify-content:center; z-index:6; pointer-events:none; }
  .sync-pill{ font-size:11px; font-weight:600; padding: 5px 12px; border-radius:999px; background: rgba(255,255,255,0.88); color: #2A3442; box-shadow: 0 2px 8px rgba(0,0,0,0.25); display:flex; align-items:center; gap:6px; opacity:0; transition: opacity 0.25s ease; }
  .sync-pill.show{ opacity:1; }
  .sync-pill .sync-dot{ width:6px; height:6px; border-radius:50%; background: #2A3442; flex-shrink:0; }
  .sync-pill.saving .sync-dot{ background: var(--sky); animation: pulse 1s infinite ease-in-out; }
  .sync-pill.saved .sync-dot{ background: var(--pine); }
  .sync-pill.error .sync-dot{ background: var(--rose); }
  @keyframes pulse{ 0%, 100%{ opacity:1; } 50%{ opacity:0.3; } }

  /* ---------- NAV BAR ---------- */
  .navbar{ position:absolute; left:0; right:0; bottom: max(14px, env(safe-area-inset-bottom)); height:44px; display:flex; align-items:center; justify-content:space-between; padding: 0 20px; z-index:5; pointer-events:none; }
  .navbar::before{ content:""; position:absolute; left:0; right:0; bottom:-14px; height:80px; background: linear-gradient(to top, var(--bg) 60%, rgba(5,8,13,0)); z-index:-1; pointer-events:none; }
  .nav-btn{ font-family:'Karla', sans-serif; font-weight:700; font-size:13px; letter-spacing:0.04em; color: var(--accent); background:none; border:none; padding: 10px 6px; cursor:pointer; display:flex; align-items:center; gap:5px; transition: opacity 0.2s ease; pointer-events:auto; }
  .nav-btn:disabled{ opacity:0; pointer-events:none; }
  .nav-btn .arrow{ font-size:15px; line-height:1; }

  /* ---------- MODAL ---------- */
  .modal-overlay{ position:fixed; inset:0; background: rgba(5,8,13,0.6); display:flex; align-items:flex-end; justify-content:center; z-index:50; opacity:0; pointer-events:none; transition: opacity 0.2s ease; }
  .modal-overlay.open{ opacity:1; pointer-events:auto; }
  .modal-sheet{ width:100%; max-width:460px; background: var(--card); border-top: 1px solid var(--line); box-shadow: 0 -12px 34px rgba(0,0,0,0.55); border-radius: 22px 22px 0 0; padding: 20px 20px max(20px, env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform 0.25s ease; max-height:82vh; overflow-y:auto; }
  .modal-overlay.open .modal-sheet{ transform: translateY(0); }
  .modal-title{ font-family:'Fraunces', serif; font-weight:700; font-size:19px; color: var(--ink); margin-bottom:16px; text-align:center; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11.5px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color: var(--ink-soft); margin-bottom:6px; }
  .field input[type="text"], .field input[type="time"], .field textarea{ width:100%; background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; font-family:'Karla', sans-serif; font-size:14.5px; color: var(--ink); -webkit-user-select:text; user-select:text; color-scheme: dark; }
  .field input::placeholder, .field textarea::placeholder{ color: var(--ink-soft); opacity:0.7; }
  .field textarea{ resize:none; height:56px; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .emoji-field input{ text-align:center; font-size:18px; }

  .modal-actions{ display:flex; gap:10px; margin-top:6px; }
  .btn{ flex:1; padding:13px; border-radius:12px; border:none; font-family:'Karla', sans-serif; font-weight:700; font-size:14px; cursor:pointer; }
  .btn-save{ background: var(--accent); color: var(--accent-ink); }
  .btn-cancel{ background: var(--card-2); color: var(--ink); }
  .btn-delete{ width:100%; margin-top:10px; padding:12px; border-radius:12px; border:1px solid var(--line); background:none; color:#FF8A8A; font-family:'Karla', sans-serif; font-weight:700; font-size:13.5px; cursor:pointer; }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }

  /* ---------- TABLE OF CONTENTS ---------- */
  .toc-list{ background: var(--card); border-radius: 18px; border:1px solid var(--line); box-shadow: 0 6px 18px rgba(0,0,0,0.25); overflow:hidden; }
  .toc-row{ display:flex; align-items:center; gap:12px; padding: 15px 18px; cursor:pointer; transition: background 0.15s ease; }
  .toc-row:active{ background: var(--card-2); }
  .toc-row + .toc-row{ border-top:1px solid var(--line); }
  .toc-icon{ width:34px; height:34px; border-radius:10px; background: var(--card-2); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
  .toc-label{ font-size:14.5px; font-weight:600; color:var(--ink); flex:1; }
  .toc-arrow{ font-size:15px; color: var(--accent); flex-shrink:0; }
  .toc-title{ font-family:'Fraunces', serif; font-weight:700; font-size:26px; text-align:center; color: var(--accent); margin-bottom:4px; }
  .toc-subtitle{ text-align:center; font-size:13.5px; color: var(--ink-soft); margin-bottom:22px; }

  /* ---------- GEAR CHECKLIST ---------- */
  .gear-progress{ text-align:center; font-size:12.5px; color: var(--ink-soft); margin: -4px 0 12px; }
  .gear-bar{ height:6px; border-radius:3px; background: var(--card-2); overflow:hidden; margin: 0 4px 16px; }
  .gear-bar-fill{ height:100%; background: linear-gradient(90deg, var(--pine), var(--accent)); width:0; transition: width 0.3s ease; }
  .gear-list{ background: var(--card); border-radius:18px; border:1px solid var(--line); overflow:hidden; }
  .gear-row{ display:flex; align-items:center; gap:12px; padding: 13px 16px; cursor:pointer; }
  .gear-row + .gear-row{ border-top:1px solid var(--line); }
  .gear-check{ width:22px; height:22px; border-radius:7px; border:1.5px solid var(--ink-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:13px; font-weight:700; color: var(--accent-ink); }
  .gear-row.done .gear-check{ background: var(--pine); border-color: var(--pine); }
  .gear-text{ flex:1; font-size:14.5px; font-weight:500; }
  .gear-row.done .gear-text{ color: var(--ink-soft); text-decoration: line-through; }
  .gear-del{ background:none; border:none; color: var(--ink-soft); font-size:18px; padding: 0 4px; cursor:pointer; line-height:1; }
  .gear-add{ display:flex; gap:8px; padding: 12px; border-top:1px solid var(--line); }
  .gear-add input{ flex:1; background: var(--card-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-family:'Karla', sans-serif; font-size:14px; color: var(--ink); -webkit-user-select:text; user-select:text; }
  .gear-add input::placeholder{ color: var(--ink-soft); opacity:0.7; }
  .gear-add button{ background: var(--accent); color: var(--accent-ink); border:none; border-radius:10px; padding: 0 14px; font-family:'Karla', sans-serif; font-weight:700; font-size:13px; cursor:pointer; }

  /* ---------- PHOTOS PAGE ---------- */
  .photo-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  .photo-card{ background: var(--card); border-radius: 16px; border:1px solid var(--line); overflow:hidden; cursor:pointer; }
  .photo-card .photo-img-wrap{ width:100%; aspect-ratio: 1 / 1; background: var(--card-2); overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .photo-card img{ display:block; width:100%; height:100%; object-fit:contain; }
  .photo-card .photo-broken{ font-size:11px; color: var(--ink-soft); text-align:center; padding:8px; }
  .photo-card .photo-caption{ padding: 8px 10px 10px; font-size:12px; font-weight:600; color: var(--ink); line-height:1.35; }
  .add-photo-card{ background: var(--card); border-radius: 16px; border:1.5px dashed var(--accent-soft); aspect-ratio: 1 / 1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; cursor:pointer; color: var(--accent); font-weight:700; font-size:12.5px; }
  .add-photo-card .plus-circle{ width:30px; height:30px; font-size:15px; }

  /* ---------- PHOTO UPLOAD ---------- */
  .photo-upload-area{ margin-bottom:12px; }
  .photo-preview-wrap{ width:100%; aspect-ratio: 4 / 3; max-height:220px; background: var(--card-2); border: 1.5px dashed var(--line); border-radius:14px; display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:pointer; }
  .photo-preview-wrap img{ width:100%; height:100%; object-fit:contain; display:block; }
  .photo-upload-placeholder{ text-align:center; color: var(--ink-soft); font-size:13px; font-weight:600; line-height:1.7; }
  .photo-upload-status{ text-align:center; font-size:12px; color: var(--ink-soft); margin: 8px 0 14px; min-height:16px; }
  .photo-upload-status.uploading{ color: var(--sky); }
  .photo-upload-status.done{ color: var(--pine); }
  .photo-upload-status.error{ color: var(--rose); }
  .photo-paste-target{ margin-top:8px; padding:10px 12px; border:1.5px dashed var(--line); border-radius:10px; font-size:0.85rem; color: var(--ink-soft); text-align:center; background: transparent; outline:none; caret-color: transparent; }
  .photo-paste-target:focus{ border-color: var(--sky); color: var(--ink); }
  .photo-paste-target:empty::before{ content: attr(data-placeholder); }
</style>
</head>
<body>
<div class="phone" id="phone">

  <div class="sync-status"><div class="sync-pill" id="syncPill"><div class="sync-dot"></div><span id="syncText">Loading...</span></div></div>

  <div class="progress" id="progress"></div>

  <div class="pages" id="pages">

    <!-- PAGE: TABLE OF CONTENTS -->
    <div class="page active" data-key="toc">
      <div class="toc-title" id="tocTitle">Snowboard Trip</div>
      <div class="toc-subtitle">Tap any section to jump straight there</div>
      <div class="toc-list" id="tocList"></div>
    </div>

    <!-- PAGE: COVER -->
    <div class="page" data-key="cover">
      <div class="cover-card">
        <div class="photo-frame">
          <svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" aria-label="Snowy mountains at night">
            <defs>
              <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#0B1B3A"/>
                <stop offset="0.6" stop-color="#27457A"/>
                <stop offset="1" stop-color="#6E8FC4"/>
              </linearGradient>
              <linearGradient id="snowG" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#FFFFFF"/>
                <stop offset="1" stop-color="#CFE3F5"/>
              </linearGradient>
            </defs>
            <rect width="400" height="260" fill="url(#skyG)"/>
            <g fill="#fff" opacity="0.85">
              <circle cx="40" cy="30" r="1.2"/><circle cx="90" cy="55" r="0.9"/><circle cx="140" cy="22" r="1.1"/>
              <circle cx="210" cy="40" r="0.8"/><circle cx="250" cy="18" r="1.3"/><circle cx="360" cy="60" r="1"/>
              <circle cx="20" cy="75" r="0.8"/><circle cx="180" cy="70" r="0.7"/><circle cx="385" cy="25" r="0.9"/>
            </g>
            <circle cx="318" cy="52" r="20" fill="#F4F1DE"/>
            <circle cx="326" cy="46" r="18" fill="#27457A" opacity="0.35"/>
            <!-- back range -->
            <path d="M0 175 L60 110 L105 150 L165 80 L225 145 L275 100 L330 150 L400 105 L400 260 L0 260 Z" fill="#3A5A8F"/>
            <path d="M165 80 L148 100 L158 98 L165 108 L174 97 L185 102 Z" fill="url(#snowG)"/>
            <path d="M60 110 L48 124 L58 122 L64 130 L72 121 Z" fill="url(#snowG)"/>
            <path d="M275 100 L262 115 L272 113 L279 121 L287 112 Z" fill="url(#snowG)"/>
            <path d="M400 105 L385 122 L395 120 L400 124 Z" fill="url(#snowG)"/>
            <!-- front slope -->
            <path d="M0 215 C80 175 150 170 220 190 C290 210 340 200 400 180 L400 260 L0 260 Z" fill="url(#snowG)"/>
            <!-- board tracks -->
            <path d="M205 188 C190 205 230 215 210 235 C195 250 225 255 215 262" fill="none" stroke="#9FB8D8" stroke-width="1.4" stroke-dasharray="3 3"/>
            <path d="M213 188 C198 205 238 215 218 235 C203 250 233 255 223 262" fill="none" stroke="#9FB8D8" stroke-width="1.4" stroke-dasharray="3 3"/>
            <!-- pines -->
            <g fill="#1F4A45">
              <path d="M40 212 L52 178 L64 212 Z"/><path d="M44 196 L52 170 L60 196 Z"/><rect x="50" y="212" width="4" height="8"/>
              <path d="M72 206 L82 180 L92 206 Z"/><rect x="80" y="206" width="3" height="7"/>
              <path d="M330 200 L343 162 L356 200 Z"/><path d="M335 182 L343 155 L351 182 Z"/><rect x="341" y="200" width="4" height="8"/>
              <path d="M362 194 L372 168 L382 194 Z"/><rect x="370" y="194" width="3" height="7"/>
            </g>
            <g fill="#fff" opacity="0.9">
              <path d="M46 200 L52 186 L58 200 Z" opacity="0.35"/>
              <path d="M337 188 L343 172 L349 188 Z" opacity="0.35"/>
            </g>
          </svg>
        </div>
        <div class="eyebrow" id="coverEyebrow">Snowboard Trip</div>
        <h1 class="title" id="coverTitle">Snowboard<br>Trip</h1>
        <div class="subdate" id="coverDates"></div>
        <div class="chips" id="coverChips"></div>
      </div>
      <div class="tap-hint">tap anywhere to begin &rarr;</div>
    </div>

    <!-- PAGE: TRIP DETAILS -->
    <div class="page" data-key="travel">
      <div class="section-label"><div class="dot"></div><span>Trip Details</span></div>
      <div class="travel-card" id="travelCard"></div>
      <div class="section-label" style="margin-top:22px;"><div class="dot"></div><span>On the Mountain</span></div>
      <div class="travel-card" id="mountainCard"></div>
      <div class="travel-card" id="stayCard" style="margin-top:12px;"></div>
      <div class="day-hint">Tap to edit</div>
    </div>

    <!-- DAY PAGES are inserted here by JS (see buildDayPages) -->
    <div id="dayPagesAnchor" style="display:none"></div>

    <!-- PAGE: GEAR CHECKLIST -->
    <div class="page" data-key="gear">
      <div class="section-label"><div class="dot"></div><span>Gear Checklist</span></div>
      <div class="gear-progress" id="gearProgress"></div>
      <div class="gear-bar"><div class="gear-bar-fill" id="gearBarFill"></div></div>
      <div class="gear-list">
        <div id="gearRows"></div>
        <div class="gear-add" id="gearAdd">
          <input type="text" id="gearInput" placeholder="Add an item...">
          <button id="gearAddBtn">Add</button>
        </div>
      </div>
    </div>

    <!-- PAGE: PHOTOS -->
    <div class="page" data-key="photos">
      <div class="section-label"><div class="dot"></div><span>Photos</span></div>
      <div class="photo-grid" id="photoGrid"></div>
    </div>

  </div>

  <div class="navbar">
    <button class="nav-btn prev" id="prevBtn"><span class="arrow">&larr;</span> prev</button>
    <button class="nav-btn next" id="nextBtn">next <span class="arrow">&rarr;</span></button>

<script>
  /* =====================================================================
     TRIP SETTINGS — edit these to match your trip
     ===================================================================== */
  const TRIP = {
    title: 'Snowboard Trip',          // shown on cover, TOC, browser tab
    destination: 'Whitefish, MT',
    startDate: '2027-01-06',       // arrival day (YYYY-MM-DD)
    endDate: '2027-01-11'          // departure day (YYYY-MM-DD)
  };

  // Paste the Web App URL of a NEW Apps Script deployment (new Sheet) here.
  // Do NOT reuse the Key West URL — it would overwrite that trip's data.
  // Leave empty to save on this device only (localStorage).
  const SYNC_URL = '';
  const LOCAL_KEY = 'snowboardTripData_v1';

  /* ---------------- DATE HELPERS ---------------- */
  function parseYMD(s){ const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
  function ymd(dt){ return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0'); }
  function longDate(dt){ return dt.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }); }
  function shortDate(dt){ return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }
  function weekday(dt){ return dt.toLocaleDateString('en-US', { weekday: 'long' }); }

  const START = parseYMD(TRIP.startDate);
  const END = parseYMD(TRIP.endDate);

  /* ---------------- DATA ---------------- */
  let uidCounter = 1;
  function uid(){ return uidCounter++; }

  function buildDefaultDays(){
    const out = [];
    const cur = new Date(START);
    let i = 0;
    while (cur <= END){
      const isFirst = ymd(cur) === TRIP.startDate;
      const isLast = ymd(cur) === TRIP.endDate;
      const events = [];
      if (isFirst){
        events.push({ id: 900 + i * 10 + 1, time: '16:00', icon: '🏔️', title: 'Check in & pick up rentals', note: '' });
      } else if (!isLast){
        events.push({ id: 900 + i * 10 + 1, time: '08:30', icon: '🚡', title: 'First chair', note: '' });
        events.push({ id: 900 + i * 10 + 2, time: '16:00', icon: '🍻', title: 'Après-ski', note: '' });
      }
      out.push({
        key: ymd(cur),
        weekday: weekday(cur),
        date: longDate(cur),
        badge: isFirst ? 'arrival' : (isLast ? 'departure' : null),
        badgeLabel: isFirst ? 'Arrival Day' : (isLast ? 'Departure Day' : ''),
        events: events
      });
      cur.setDate(cur.getDate() + 1);
      i++;
    }
    return out;
  }

  const DEFAULT_TRAVEL = {
    arrival:   { label: 'Arrival',       icon: '✈️', date: shortDate(START), flightNumber: '', depart: '', note: '', placeholder: 'e.g. Flight DL 1234 FLL → SLC' },
    departure: { label: 'Departure',     icon: '🛫', date: shortDate(END),   flightNumber: '', depart: '', note: '', placeholder: 'e.g. Flight DL 5678 SLC → FLL' },
    passes:    { label: 'Lift Tickets',  icon: '🎟️', date: '', flightNumber: '', depart: '', note: '', placeholder: 'e.g. 3-day pass, pick up at window' },
    rentals:   { label: 'Gear Rentals',  icon: '🏂', date: '', flightNumber: '', depart: '', note: '', placeholder: 'e.g. Board, boots, bindings — shop name' }
  };
  const TRAVEL_KEYS = ['arrival', 'departure'];
  const MOUNTAIN_KEYS = ['passes', 'rentals'];

  const DEFAULT_STAY = { hotel: 'VRBO', nights: '5 nights', type: '834 Highland Drive, Whitefish, MT' };

  const DEFAULT_GEAR = [
    'Helmet', 'Goggles', 'Gloves / mittens', 'Base layers', 'Mid layer / fleece',
    'Snow jacket & pants', 'Snowboard socks', 'Neck gaiter', 'Sunscreen & lip balm', 'Hand warmers', 'Wrist guards', 'Lift pass'
  ].map((t, i) => ({ id: 800 + i, text: t, done: false }));


  function clone(o){ return JSON.parse(JSON.stringify(o)); }

  let days = buildDefaultDays();
  let travel = clone(DEFAULT_TRAVEL);
  let stay = clone(DEFAULT_STAY);
  let gear = clone(DEFAULT_GEAR);
  let photos = [];

  /* ---------------- STATIC TEXT ---------------- */
  document.title = TRIP.title;
  document.getElementById('tocTitle').textContent = TRIP.title;
  document.getElementById('coverTitle').innerHTML = escapeHtml(TRIP.title).replace(' ', '<br>');
  document.getElementById('coverEyebrow').textContent =
    TRIP.destination + ' · ' + START.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  document.getElementById('coverDates').textContent =
    START.toLocaleDateString('en-US', { month: 'long', day: 'numeric' }) + ' – ' + longDate(END);
  document.getElementById('coverChips').innerHTML =
    '<div class="chip">✈️ Arrive ' + START.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + '</div>' +
    '<div class="chip">🏂 ' + days.length + ' Days on Snow</div>' +
    '<div class="chip">🛫 Depart ' + END.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + '</div>';

  /* ---------------- BUILD DAY PAGES ---------------- */
  (function buildDayPages(){
    const anchor = document.getElementById('dayPagesAnchor');
    days.forEach((_, i) => {
      const p = document.createElement('div');
      p.className = 'page';
      p.dataset.day = i;
      anchor.parentNode.insertBefore(p, anchor);
    });
    anchor.remove();
  })();

  /* ---------------- SYNC ---------------- */
  const syncPill = document.getElementById('syncPill');
  const syncText = document.getElementById('syncText');

  function setSyncStatus(state, label){
    syncPill.className = 'sync-pill show ' + state;
    syncText.textContent = label;
    if (state === 'saved') setTimeout(() => syncPill.classList.remove('show'), 1800);
  }

  function highestUid(){
    let max = 1000;
    days.forEach(d => d.events.forEach(ev => { if (ev.id > max) max = ev.id; }));
    photos.forEach(p => { if (p.id > max) max = p.id; });
    gear.forEach(g => { if (g.id > max) max = g.id; });
    return max;
  }

  // Merge saved data onto the current trip layout, matching days by date so
  // changing TRIP dates later doesn't scramble events.
  function applyData(data){
    if (Array.isArray(data.days)){
      days.forEach(d => {
        const saved = data.days.find(s => s.key === d.key);
        if (saved && Array.isArray(saved.events)) d.events = saved.events;
      });
    }
    if (data.travel){
      Object.keys(travel).forEach(k => {
        if (data.travel[k]){
          ['flightNumber', 'depart', 'note'].forEach(f => {
            if (data.travel[k][f] !== undefined) travel[k][f] = data.travel[k][f];
          });
        }
      });
    }
    if (data.stay) stay = Object.assign(clone(DEFAULT_STAY), data.stay);
    if (Array.isArray(data.gear)) gear = data.gear;
    if (Array.isArray(data.photos)) photos = data.photos;
    uidCounter = highestUid() + 1;
  }

  function payload(){
    return { days: days, travel: travel, stay: stay, gear: gear, photos: photos };
  }

  function saveLocal(){
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(payload())); return true; }
    catch (e){ return false; }
  }
  function loadLocal(){
    try { const raw = localStorage.getItem(LOCAL_KEY); return raw ? JSON.parse(raw) : null; }
    catch (e){ return null; }
  }

  async function loadData(){
    setSyncStatus('saving', 'Loading itinerary...');
    if (!SYNC_URL){
      const local = loadLocal();
      if (local) applyData(local);
      setSyncStatus('saved', 'Saved on this device');
    } else {
      try {
        const res = await fetch(SYNC_URL, { method: 'GET' });
        const data = await res.json();
        if (data && data.days){
          applyData(data);
          saveLocal();
          setSyncStatus('saved', 'Synced');
        } else {
          setSyncStatus('saved', 'Ready');
          await saveData();
        }
      } catch (err){
        const local = loadLocal();
        if (local) applyData(local);
        setSyncStatus('error', 'Offline — showing local copy');
      }
    }
    renderEverything();
  }

  async function saveData(){
    const localOk = saveLocal();
    if (!SYNC_URL){
      setSyncStatus(localOk ? 'saved' : 'error', localOk ? 'Saved' : 'Could not save on this device');
      return;
    }
    setSyncStatus('saving', 'Saving...');
    try {
      // text/plain avoids a CORS preflight that Apps Script Web Apps often fail
      await fetch(SYNC_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload())
      });
      setSyncStatus('saved', 'Saved');
    } catch (err){
      setSyncStatus('error', 'Could not save — check connection');
    }
  }

  /* ---------------- HELPERS ---------------- */
  function formatTime(t){
    if (!t) return '';
    const [hStr, m] = t.split(':');
    let h = parseInt(hStr, 10);
    const ampm = h >= 12 ? 'p' : 'a';
    h = h % 12; if (h === 0) h = 12;
    return (m === '00') ? (h + ampm) : (h + ':' + m + ampm);
  }
  function sortEvents(events){
    return events.slice().sort((a, b) => {
      const at = a.time || '99:99', bt = b.time || '99:99';
      return at === bt ? 0 : (at < bt ? -1 : 1);
    });
  }
  function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

  /* ---------------- DAY PAGES ---------------- */
  function renderDay(dayIdx){
    const day = days[dayIdx];
    const pageEl = document.querySelector('.page[data-day="' + dayIdx + '"]');

    let badgeHtml = '';
    if (day.badge === 'arrival') badgeHtml = '<div class="day-badge badge-arrival">' + day.badgeLabel + '</div>';
    if (day.badge === 'departure') badgeHtml = '<div class="day-badge badge-departure">' + day.badgeLabel + '</div>';

    const sorted = sortEvents(day.events);
    const eventsHtml = sorted.length === 0
      ? '<div class="empty-state">No events yet &mdash; tap below to add the first one</div>'
      : sorted.map(ev =>
          '<div class="event" data-event-id="' + ev.id + '" data-day-idx="' + dayIdx + '">' +
            '<div class="event-time">' + (ev.time ? formatTime(ev.time) : '') + '</div>' +
            '<div class="event-icon">' + (ev.icon || '📌') + '</div>' +
            '<div class="event-body"><div class="event-title">' + escapeHtml(ev.title) + '</div>' +
              (ev.note ? '<div class="event-note">' + escapeHtml(ev.note) + '</div>' : '') +
            '</div>' +
          '</div>').join('');

    pageEl.innerHTML =
      '<div class="day-hero">' +
        '<div class="eyebrow">Day ' + (dayIdx + 1) + ' of ' + days.length + '</div>' +
        '<div class="day-title">' + day.weekday + '</div>' +
        '<div class="day-date">' + day.date + '</div>' +
        badgeHtml +
      '</div>' +
      '<div class="day-card">' +
        '<div class="event-list">' + eventsHtml + '</div>' +
        '<div class="add-event-row" data-day-idx="' + dayIdx + '"><div class="plus-circle">+</div> Add an event</div>' +
      '</div>' +
      '<div class="day-hint">Tap an event to edit &middot; tap + to add</div>';

    pageEl.querySelectorAll('.event').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        openModal(parseInt(el.dataset.dayIdx), parseInt(el.dataset.eventId));
      });
    });
    pageEl.querySelector('.add-event-row').addEventListener('click', (e) => {
      e.stopPropagation();
      openModal(parseInt(e.currentTarget.dataset.dayIdx), null);
    });
  }
  function renderAllDays(){ days.forEach((_, i) => renderDay(i)); }

  /* ---------------- TRIP DETAILS ---------------- */
  function detailRow(key){
    const t = travel[key];
    let sub;
    if (!t.flightNumber && !t.depart && !t.note){
      sub = 'Tap to add details';
    } else {
      const parts = [];
      if (t.flightNumber) parts.push(escapeHtml(t.flightNumber));
      if (t.depart) parts.push(formatTime(t.depart));
      if (t.note) parts.push(escapeHtml(t.note));
      sub = parts.join(' &middot; ');
    }
    return '<div class="flight-row" data-flight="' + key + '">' +
      '<div class="flight-left">' +
        '<div class="flight-icon">' + t.icon + '</div>' +
        '<div><div class="flight-name">' + t.label + '</div><div class="flight-sub">' + sub + '</div></div>' +
      '</div>' +
      (t.date ? '<div class="flight-date">' + t.date + '</div>' : '') +
    '</div>';
  }

  function renderTravel(){
    const travelCard = document.getElementById('travelCard');
    const mountainCard = document.getElementById('mountainCard');
    travelCard.innerHTML = TRAVEL_KEYS.map(detailRow).join('');
    mountainCard.innerHTML = MOUNTAIN_KEYS.map(detailRow).join('');
    [travelCard, mountainCard].forEach(card => {
      card.querySelectorAll('.flight-row').forEach(el => {
        el.addEventListener('click', (e) => { e.stopPropagation(); openFlightModal(el.dataset.flight); });
      });
    });
  }

  function renderStay(){
    const card = document.getElementById('stayCard');
    let sub;
    if (!stay.hotel && !stay.nights && !stay.type){
      sub = 'Tap to add lodging';
    } else {
      const parts = [];
      if (stay.nights) parts.push(escapeHtml(stay.nights));
      if (stay.type) parts.push(escapeHtml(stay.type));
      sub = parts.join(' &middot; ') || 'Tap to edit';
    }
    card.innerHTML =
      '<div class="flight-row" data-stay="1">' +
        '<div class="flight-left">' +
          '<div class="flight-icon">🏨</div>' +
          '<div><div class="flight-name">' + (stay.hotel ? escapeHtml(stay.hotel) : "Where We're Staying") + '</div>' +
          '<div class="flight-sub">' + sub + '</div></div>' +
        '</div>' +
      '</div>';
    card.querySelector('.flight-row').addEventListener('click', (e) => { e.stopPropagation(); openStayModal(); });
  }

  /* ---------------- EVENT MODAL ---------------- */
  const modalOverlay = document.getElementById('modalOverlay');
  const modalTitle = document.getElementById('modalTitle');
  const fEmoji = document.getElementById('fEmoji');
  const fTime = document.getElementById('fTime');
  const fTitle = document.getElementById('fTitle');
  const fNote = document.getElementById('fNote');
  const btnSave = document.getElementById('btnSave');
  const btnCancel = document.getElementById('btnCancel');
  const btnDelete = document.getElementById('btnDelete');
  let editingDayIdx = null, editingEventId = null;

  function openModal(dayIdx, eventId){
    editingDayIdx = dayIdx; editingEventId = eventId;
    if (eventId === null){
      modalTitle.textContent = 'Add Event';
      fEmoji.value = ''; fTime.value = ''; fTitle.value = ''; fNote.value = '';
      btnDelete.style.display = 'none';
    } else {
      const ev = days[dayIdx].events.find(e => e.id === eventId);
      modalTitle.textContent = 'Edit Event';
      fEmoji.value = ev.icon || ''; fTime.value = ev.time || ''; fTitle.value = ev.title || ''; fNote.value = ev.note || '';
      btnDelete.style.display = 'block';
    }
    modalOverlay.classList.add('open');
  }
  function closeModal(){ modalOverlay.classList.remove('open'); editingDayIdx = null; editingEventId = null; }

  btnCancel.addEventListener('click', (e) => { e.stopPropagation(); closeModal(); });
  modalOverlay.addEventListener('click', () => closeModal());
  btnSave.addEventListener('click', (e) => {
    e.stopPropagation();
    const title = fTitle.value.trim();
    if (!title){ fTitle.focus(); return; }
    const data = { icon: fEmoji.value.trim() || '🏂', time: fTime.value || '', title: title, note: fNote.value.trim() };
    if (editingEventId === null){
      days[editingDayIdx].events.push(Object.assign({ id: uid() }, data));
    } else {
      Object.assign(days[editingDayIdx].events.find(ev => ev.id === editingEventId), data);
    }
    renderDay(editingDayIdx);
    closeModal();
    saveData();
  });
  btnDelete.addEventListener('click', (e) => {
    e.stopPropagation();
    if (editingEventId !== null){
      days[editingDayIdx].events = days[editingDayIdx].events.filter(ev => ev.id !== editingEventId);
      renderDay(editingDayIdx);
    }
    closeModal();
    saveData();
  });

  /* ---------------- TRIP DETAIL MODAL ---------------- */
  const flightModalOverlay = document.getElementById('flightModalOverlay');
  const flightModalTitle = document.getElementById('flightModalTitle');
  const flNumber = document.getElementById('flNumber');
  const flDepart = document.getElementById('flDepart');
  const flNote = document.getElementById('flNote');
  const flBtnSave = document.getElementById('flBtnSave');
  const flBtnCancel = document.getElementById('flBtnCancel');
  let editingFlightKey = null;

  function openFlightModal(key){
    editingFlightKey = key;
    const t = travel[key];
    flightModalTitle.textContent = 'Edit ' + t.label;
    flNumber.placeholder = t.placeholder || '';
    flNumber.value = t.flightNumber || '';
    flDepart.value = t.depart || '';
    flNote.value = t.note || '';
    flightModalOverlay.classList.add('open');
  }
  function closeFlightModal(){ flightModalOverlay.classList.remove('open'); editingFlightKey = null; }

  flBtnCancel.addEventListener('click', (e) => { e.stopPropagation(); closeFlightModal(); });
  flightModalOverlay.addEventListener('click', () => closeFlightModal());
  flBtnSave.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!editingFlightKey) return;
    const t = travel[editingFlightKey];
    t.flightNumber = flNumber.value.trim();
    t.depart = flDepart.value || '';
    t.note = flNote.value.trim();
    renderTravel();
    closeFlightModal();
    saveData();
  });

  /* ---------------- STAY MODAL ---------------- */
  const stayModalOverlay = document.getElementById('stayModalOverlay');
  const stHotel = document.getElementById('stHotel');
  const stNights = document.getElementById('stNights');
  const stType = document.getElementById('stType');

  function openStayModal(){
    stHotel.value = stay.hotel || ''; stNights.value = stay.nights || ''; stType.value = stay.type || '';
    stayModalOverlay.classList.add('open');
  }
  function closeStayModal(){ stayModalOverlay.classList.remove('open'); }
  document.getElementById('stBtnCancel').addEventListener('click', (e) => { e.stopPropagation(); closeStayModal(); });
  stayModalOverlay.addEventListener('click', () => closeStayModal());
  document.getElementById('stBtnSave').addEventListener('click', (e) => {
    e.stopPropagation();
    stay.hotel = stHotel.value.trim(); stay.nights = stNights.value.trim(); stay.type = stType.value.trim();
    renderStay();
    closeStayModal();
    saveData();
  });

  /* ---------------- GEAR CHECKLIST ---------------- */
  const gearInput = document.getElementById('gearInput');

  function renderGear(){
    const rows = document.getElementById('gearRows');
    rows.innerHTML = '';
    gear.forEach(g => {
      const row = document.createElement('div');
      row.className = 'gear-row' + (g.done ? ' done' : '');
      row.innerHTML = '<div class="gear-check">' + (g.done ? '✓' : '') + '</div>' +
        '<div class="gear-text">' + escapeHtml(g.text) + '</div>' +
        '<button class="gear-del" aria-label="Remove">&times;</button>';
      row.addEventListener('click', (e) => {
        e.stopPropagation();
        g.done = !g.done;
        renderGear();
        saveData();
      });
      row.querySelector('.gear-del').addEventListener('click', (e) => {
        e.stopPropagation();
        gear = gear.filter(x => x.id !== g.id);
        renderGear();
        saveData();
      });
      rows.appendChild(row);
    });
    const done = gear.filter(g => g.done).length;
    document.getElementById('gearProgress').textContent = done + ' of ' + gear.length + ' packed';
    document.getElementById('gearBarFill').style.width = gear.length ? (done / gear.length * 100) + '%' : '0';
  }

  function addGear(){
    const text = gearInput.value.trim();
    if (!text) return;
    gear.push({ id: uid(), text: text, done: false });
    gearInput.value = '';
    renderGear();
    saveData();
  }
  document.getElementById('gearAdd').addEventListener('click', (e) => e.stopPropagation());
  document.getElementById('gearAddBtn').addEventListener('click', (e) => { e.stopPropagation(); addGear(); });
  gearInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addGear(); });

  /* ---------------- PHOTOS ---------------- */
  function renderPhotos(){
    const grid = document.getElementById('photoGrid');
    grid.innerHTML = '';
    photos.forEach(p => {
      const card = document.createElement('div');
      card.className = 'photo-card';
      const imgWrap = document.createElement('div');
      imgWrap.className = 'photo-img-wrap';
      const img = document.createElement('img');
      img.src = p.url;
      img.alt = p.caption || 'Trip photo';
      img.onerror = function(){ imgWrap.innerHTML = '<div class="photo-broken">Image didn&rsquo;t load</div>'; };
      imgWrap.appendChild(img);
      card.appendChild(imgWrap);
      if (p.caption){
        const cap = document.createElement('div');
        cap.className = 'photo-caption';
        cap.textContent = p.caption;
        card.appendChild(cap);
      }
      card.addEventListener('click', (e) => { e.stopPropagation(); openPhotoModal(p.id); });
      grid.appendChild(card);
    });
    const addCard = document.createElement('div');
    addCard.className = 'add-photo-card';
    addCard.innerHTML = '<div class="plus-circle">+</div>Add Photo';
    addCard.addEventListener('click', (e) => { e.stopPropagation(); openPhotoModal(null); });
    grid.appendChild(addCard);
  }

  const photoModalOverlay = document.getElementById('photoModalOverlay');
  const photoModalTitle = document.getElementById('photoModalTitle');
  const pCaption = document.getElementById('pCaption');
  const pBtnSave = document.getElementById('pBtnSave');
  const pBtnDelete = document.getElementById('pBtnDelete');
  const pFile = document.getElementById('pFile');
  const photoPreviewWrap = document.getElementById('photoPreviewWrap');
  const photoUploadStatus = document.getElementById('photoUploadStatus');
  let editingPhotoId = null, pendingUploadUrl = null, existingPhotoUrl = null;

  function resetPhotoPreview(){ photoPreviewWrap.innerHTML = '<div class="photo-upload-placeholder">📷<br>Tap to choose from your photos</div>'; }
  function showPhotoPreview(url){
    photoPreviewWrap.innerHTML = '';
    const img = document.createElement('img');
    img.src = url;
    img.onerror = () => resetPhotoPreview();
    photoPreviewWrap.appendChild(img);
  }
  function setUploadStatus(state, text){
    photoUploadStatus.textContent = text;
    photoUploadStatus.className = 'photo-upload-status' + (state ? ' ' + state : '');
  }

  // Shrinks a picked photo client-side before it leaves the phone.
  function resizeImageFile(file, maxDim, quality){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Could not read file'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('Could not decode image'));
        img.onload = () => {
          let w = img.width, h = img.height;
          if (w >= h && w > maxDim){ h = Math.round(h * (maxDim / w)); w = maxDim; }
          else if (h > w && h > maxDim){ w = Math.round(w * (maxDim / h)); h = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  photoPreviewWrap.addEventListener('click', (e) => { e.stopPropagation(); pFile.click(); });
  pFile.addEventListener('click', (e) => e.stopPropagation());

  async function uploadPhotoFile(file, filename){
    pBtnSave.disabled = true;
    setUploadStatus('uploading', 'Preparing photo…');
    try {
      // Without a Sheet backend, photos are stored on-device, so keep them smaller.
      const resizedDataUrl = SYNC_URL
        ? await resizeImageFile(file, 1600, 0.82)
        : await resizeImageFile(file, 1000, 0.72);
      showPhotoPreview(resizedDataUrl);

      if (!SYNC_URL){
        pendingUploadUrl = resizedDataUrl;
        setUploadStatus('done', 'Photo ready — tap Save to add it');
        return;
      }

      setUploadStatus('uploading', 'Uploading…');
      const res = await fetch(SYNC_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'uploadPhoto',
          filename: filename || file.name || 'photo.jpg',
          mimeType: 'image/jpeg',
          data: resizedDataUrl.split(',')[1]
        })
      });
      const result = await res.json();
      if (result && result.success && result.url){
        pendingUploadUrl = result.url;
        setUploadStatus('done', 'Photo ready — tap Save to add it');
      } else {
        throw new Error((result && result.error) || 'Upload failed');
      }
    } catch (err){
      setUploadStatus('error', 'Could not upload — please try again');
    } finally {
      pBtnSave.disabled = false;
    }
  }

  pFile.addEventListener('change', async () => {
    const file = pFile.files && pFile.files[0];
    if (file) await uploadPhotoFile(file);
  });

  function extractImageFromClipboard(e){
    const items = (e.clipboardData && e.clipboardData.items) || [];
    for (let i = 0; i < items.length; i++){
      if (items[i].type && items[i].type.indexOf('image') === 0) return items[i].getAsFile();
    }
    return null;
  }
  async function handlePastedImage(e){
    const file = extractImageFromClipboard(e);
    if (!file) return;
    e.preventDefault();
    await uploadPhotoFile(file, file.name || 'pasted-photo.jpg');
  }
  const photoPasteTarget = document.getElementById('photoPasteTarget');
  photoPasteTarget.addEventListener('click', (e) => e.stopPropagation());
  photoPasteTarget.addEventListener('paste', handlePastedImage);
  photoPasteTarget.addEventListener('input', () => { photoPasteTarget.textContent = ''; });
  photoModalOverlay.addEventListener('paste', handlePastedImage);

  function openPhotoModal(photoId){
    editingPhotoId = photoId;
    pendingUploadUrl = null;
    pFile.value = '';
    setUploadStatus('', '');
    if (photoId === null){
      photoModalTitle.textContent = 'Add Photo';
      existingPhotoUrl = null;
      pCaption.value = '';
      pBtnDelete.style.display = 'none';
      resetPhotoPreview();
    } else {
      const p = photos.find(x => x.id === photoId);
      photoModalTitle.textContent = 'Edit Photo';
      existingPhotoUrl = p.url || null;
      pCaption.value = p.caption || '';
      pBtnDelete.style.display = 'block';
      showPhotoPreview(p.url);
    }
    photoModalOverlay.classList.add('open');
  }
  function closePhotoModal(){ photoModalOverlay.classList.remove('open'); editingPhotoId = null; pendingUploadUrl = null; }

  document.getElementById('pBtnCancel').addEventListener('click', (e) => { e.stopPropagation(); closePhotoModal(); });
  photoModalOverlay.addEventListener('click', () => closePhotoModal());
  pBtnSave.addEventListener('click', (e) => {
    e.stopPropagation();
    const url = pendingUploadUrl || existingPhotoUrl;
    if (!url){ setUploadStatus('error', 'Choose a photo first'); return; }
    const data = { url: url, caption: pCaption.value.trim() };
    if (editingPhotoId === null) photos.push(Object.assign({ id: uid() }, data));
    else Object.assign(photos.find(x => x.id === editingPhotoId), data);
    renderPhotos();
    closePhotoModal();
    saveData();
  });
  pBtnDelete.addEventListener('click', (e) => {
    e.stopPropagation();
    if (editingPhotoId !== null){
      photos = photos.filter(x => x.id !== editingPhotoId);
      renderPhotos();
    }
    closePhotoModal();
    saveData();
  });

  /* ---------------- TABLE OF CONTENTS ---------------- */
  function renderTOC(){
    const list = document.getElementById('tocList');
    const rowsData = [
      { key: 'cover', icon: '🏔️', label: 'Cover' },
      { key: 'travel', icon: '✈️', label: 'Trip Details' }
    ];
    days.forEach((d, i) => rowsData.push({ key: 'day-' + i, icon: '📅', label: 'Day ' + (i + 1) + ' · ' + d.weekday }));
    rowsData.push(
      { key: 'gear', icon: '🎒', label: 'Gear Checklist' },
      { key: 'photos', icon: '📸', label: 'Photos' }
    );
    list.innerHTML = '';
    rowsData.forEach(r => {
      const row = document.createElement('div');
      row.className = 'toc-row';
      row.innerHTML = '<div class="toc-icon">' + r.icon + '</div><div class="toc-label">' + r.label + '</div><div class="toc-arrow">&rarr;</div>';
      row.addEventListener('click', (e) => { e.stopPropagation(); gotoKey(r.key); });
      list.appendChild(row);
    });
  }

  function gotoKey(key){
    const targetEl = key.indexOf('day-') === 0
      ? document.querySelector('.page[data-day="' + key.split('-')[1] + '"]')
      : document.querySelector('.page[data-key="' + key + '"]');
    if (!targetEl) return;
    const idx = pages.indexOf(targetEl);
    if (idx === -1) return;
    current = idx;
    render();
  }

  /* ---------------- PAGE NAVIGATION ---------------- */
  const pages = Array.from(document.querySelectorAll('.page'));
  const total = pages.length;
  let current = 0;

  const progressEl = document.getElementById('progress');
  pages.forEach(() => {
    const seg = document.createElement('div');
    seg.className = 'seg';
    progressEl.appendChild(seg);
  });
  const segs = Array.from(progressEl.children);
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  function render(){
    pages.forEach((p, i) => p.classList.toggle('active', i === current));
    segs.forEach((s, i) => { s.classList.toggle('on', i === current); s.classList.toggle('done', i < current); });
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === total - 1;
    pages[current].scrollTop = 0;
  }
  function goNext(){ if (current < total - 1){ current++; render(); } }
  function goPrev(){ if (current > 0){ current--; render(); } }

  prevBtn.addEventListener('click', (e) => { e.stopPropagation(); goPrev(); });
  nextBtn.addEventListener('click', (e) => { e.stopPropagation(); goNext(); });

  const TAP_IGNORE = ['.nav-btn', '.event', '.add-event-row', '.flight-row', '.toc-row', '.photo-card',
    '.add-photo-card', '.gear-row', '.gear-add'];
  const OVERLAYS = [modalOverlay, flightModalOverlay, stayModalOverlay, photoModalOverlay];

  document.getElementById('phone').addEventListener('click', (e) => {
    if (TAP_IGNORE.some(sel => e.target.closest(sel))) return;
    if (OVERLAYS.some(o => o.classList.contains('open'))) return;
    goNext();
  });

  function renderEverything(){
    renderAllDays();
    renderTravel();
    renderStay();
    renderGear();
    renderPhotos();
    renderTOC();
  }

  renderEverything();
  render();
  loadData();
</script>
</body>
</html>
